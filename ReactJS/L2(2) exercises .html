<!doctype html>
<html>
  <head>
    <title>L2 (P2) exercise</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/dayJS.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ProductDetails({ name, price, discount }) {
        return (
          <div>
            <p>{name}</p>
            {discount && (
              <del>
                <p>Price: {price}</p>
              </del>
            )}
            {discount && <p>Discount: {discount}</p>}
            <button>Add to Cart</button>
          </div>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails
              name="Cotton Socks"
              price="$10.90"
              discount="5.45"
            />

            <ProductDetails name="Tennis balls" price="$6.00" />
            <ProductDetails name="Plain T-shirt" price="$7.99" />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);

      root.render(<App />);
    </script>
  </body>
</html>
